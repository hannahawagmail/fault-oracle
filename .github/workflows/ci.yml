# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: "1.21"
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: exporter/go.sum
      - run: pip install ruff
      - run: sudo apt-get install -y shellcheck
      - name: make lint
        run: make lint

  test-python:
    name: Python Tests
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r tests/requirements.txt pytest-cov hypothesis
      - name: make test
        run: make test

  test-go:
    name: Go Tests
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: exporter/go.sum
      - name: make test-go
        run: make test-go

  test-shell:
    name: BATS Tests
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          git clone --depth=1 https://github.com/bats-core/bats-core /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
      - name: make test-shell
        run: make test-shell

  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-22.04
    needs: lint
    strategy:
      matrix:
        goarch: [arm64, amd64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: exporter/go.sum
      - name: Build exporter
        run: |
          cd exporter && GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty)" \
            -o hw-fault-exporter-${{ matrix.goarch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: hw-fault-exporter-${{ matrix.goarch }}
          path: exporter/hw-fault-exporter-${{ matrix.goarch }}

  docker:
    name: Docker Image
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: exporter/
          push: false
          tags: hw-fault-exporter:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker build -t hw-fault-exporter:test exporter/
          docker run --rm hw-fault-exporter:test --help | grep -q "hw-fault-exporter"

  qemu:
    name: QEMU Integration
    runs-on: ubuntu-22.04
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y qemu-system-aarch64 jq bc
      - uses: actions/download-artifact@v4
        with:
          name: hw-fault-exporter-arm64
          path: exporter/
      - name: QEMU boot test
        timeout-minutes: 10
        run: |
          chmod +x exporter/hw-fault-exporter-arm64
          bash ci/qemu-boot.sh \
            --exporter exporter/hw-fault-exporter-arm64 \
            --timeout 300

  certs:
    name: Generate TLS Certs
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Generate test certificates
        run: bash security/generate-certs.sh
      - name: Verify certs created
        run: |
          ls security/certs/*.pem
          openssl x509 -in security/certs/server.pem -noout -subject
