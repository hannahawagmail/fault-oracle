name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or limitation you're hitting.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: difficulty
    attributes:
      label: Estimated difficulty
      options:
        - Good first issue (< 4 hours)
        - Intermediate (< 2 days)
        - Advanced (> 2 days)
        - Architecture change
