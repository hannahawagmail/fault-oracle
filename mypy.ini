[mypy]
# SPDX-License-Identifier: Apache-2.0
# mypy configuration — type-checks the ML and statistical pipeline

python_version = 3.11
warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True

# Do NOT use strict = True — would require full annotation across 20+ files at once.
# We harden incrementally: add annotations, then tighten per-module overrides below.

# --- Modules with third-party stubs ---
[mypy-prophet.*]
ignore_missing_imports = True

[mypy-lifelines.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

# --- Modules under active type-checking ---
[mypy-ml.*]
disallow_untyped_defs = True

[mypy-anomaly.*]
disallow_untyped_defs = True

[mypy-aging.*]
disallow_untyped_defs = True

[mypy-correlation.*]
disallow_untyped_defs = True

# --- Modules that are scripts (shim files) — lighter checking ---
[mypy-ml.ce_forecaster]
ignore_errors = True

[mypy-ml.probability_exporter]
ignore_errors = True

[mypy-ml.survival_analysis]
ignore_errors = True

[mypy-ml.ai_runbook]
ignore_errors = True
