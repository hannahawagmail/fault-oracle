# SPDX-License-Identifier: Apache-2.0
# Ruff configuration — fast Python linter replacing flake8 + isort + pyupgrade

line-length = 100
target-version = "py311"

[lint]
# E = pycodestyle errors, F = pyflakes, W = pycodestyle warnings
# I = isort, UP = pyupgrade, B = flake8-bugbear, C4 = flake8-comprehensions
select = ["E", "F", "W", "I", "UP", "B", "C4"]

ignore = [
    "E501",   # line too long — black handles this
    "B008",   # do not perform function calls in default arguments (common in argparse)
    "UP007",  # X | Y union syntax — keep Optional[X] for Python 3.9 compat
]

# Per-file ignores
[lint.per-file-ignores]
# Test files: allow assert statements and unused imports (fixtures)
"**/tests/test_*.py" = ["F401", "F811"]
# Shim files that exec() main scripts
"**/ce_forecaster.py"         = ["F401", "E402"]
"**/rasdaemon_exporter.py"    = ["F401", "E402"]
"**/zscore_detector.py"       = ["F401", "E402"]
"**/event_correlator.py"      = ["F401", "E402"]
"**/dmesg_watcher.py"         = ["F401", "E402"]
"**/dimm_aging_report.py"     = ["F401", "E402"]
"**/annotation_pusher.py"     = ["F401", "E402"]
"**/bert_reader.py"           = ["F401", "E402"]
"**/probability_exporter.py"  = ["F401", "E402"]
"**/survival_analysis.py"     = ["F401", "E402"]
"**/ai_runbook.py"            = ["F401", "E402"]

[lint.isort]
known-first-party = ["ml", "anomaly", "aging", "correlation", "ras", "apei", "annotations"]
