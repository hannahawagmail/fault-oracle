# yamllint configuration
extends: default

rules:
  line-length:
    max: 120
    level: warning
  comments:
    min-spaces-from-content: 1
  document-start: disable    # allow files without leading ---
  truthy:
    allowed-values: ["true", "false", "on", "off", "yes", "no"]
    check-keys: false
