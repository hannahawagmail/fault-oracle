# Headless ClusterIP service for Prometheus scraping DCGM exporter on port 9400
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: fault-resilience
  labels:
    app: dcgm-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9400"
    prometheus.io/path: "/metrics"
spec:
  # clusterIP: None makes this headless — Prometheus can discover each pod endpoint
  clusterIP: None
  selector:
    app: dcgm-exporter
  ports:
  - name: metrics
    port: 9400
    targetPort: 9400
    protocol: TCP
