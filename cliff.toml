# cliff.toml — git-cliff CHANGELOG generation configuration
# Docs: https://git-cliff.org/docs/configuration
# Usage: git-cliff --output CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to fault-oracle are documented here.
Format follows [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).

"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [Unreleased]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true
footer = """
---
*Generated by [git-cliff](https://git-cliff.org/)*
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat",     group = "Features"         },
  { message = "^fix",      group = "Bug fixes"        },
  { message = "^docs",     group = "Documentation"    },
  { message = "^test",     group = "Tests"            },
  { message = "^ci",       group = "CI/CD"            },
  { message = "^refactor", group = "Refactoring"      },
  { message = "^perf",     group = "Performance"      },
  { message = "^chore",    group = "Maintenance"      },
  { body = ".*security",   group = "Security"         },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = "v0\\.1\\.0-beta\\.1"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
