# SPDX-License-Identifier: Apache-2.0
# rauc-system.conf — RAUC system configuration for A/B ARM board
#
# Board: ARM64 embedded SoC with eMMC storage
# Layout: boot (mmcblk0p1), rootfs-A (mmcblk0p2), rootfs-B (mmcblk0p3), data (mmcblk0p4)
#
# Install to: /etc/rauc/system.conf
# Reload with: systemctl restart rauc
#
# Slot states (managed by RAUC in /data/rauc-status):
#   booted   — slot that the currently running system booted from
#   active   — slot marked as the primary boot target
#   inactive — slot that will receive the next update
#
# RAUC determines which slot is currently booted by reading the
# bootloader environment (fw_printenv) and comparing it to the
# bootname= values defined below.

[system]
# compatible= must match the "compatible" field in the bundle's manifest.raucm.
# RAUC refuses to install a bundle if the strings do not match exactly.
# Use a string that encodes both the hardware generation and the SoC family so
# that you cannot accidentally install an A board image onto a B board.
compatible=arm64-soc-v1

# bootloader= tells RAUC which boot environment tool to use.
# Supported: uboot, grub, efi, barebox, custom
# For uboot: RAUC calls fw_setenv / fw_printenv from the u-boot-tools package.
bootloader=uboot

# statusfile= is a file RAUC uses to persist slot state (good/bad/booted).
# It must live on a partition that survives rootfs updates — hence /data.
# Do NOT put it on the rootfs partition; it would be wiped by each update.
statusfile=/data/rauc-status

# max-bundle-download-size= limits how large a bundle RAUC will download over
# DBus InstallBundle(). Prevents exhausting storage with a malformed URL.
# 512 MiB expressed in bytes:
max-bundle-download-size=536870912

[keyring]
# path= points to the PEM-encoded certificate (or chain) used to verify the
# CMS signature inside the .raucb bundle. The private key that signed the
# bundle must correspond to this certificate but must NOT be on the device.
#
# Generate with:
#   openssl genrsa -out update-key.pem 4096
#   openssl req -new -x509 -key update-key.pem -out update-cert.pem -days 3650
#
# Then deploy update-cert.pem to all devices and keep update-key.pem on your
# secure build server (or HSM).
path=/etc/rauc/keyring.pem

# allow-partial-chain=false (default): the certificate in path= must be a
# self-signed CA or a chain ending in a known root. Set to true only if you
# sign bundles with an intermediate cert and distribute the intermediate here.
allow-partial-chain=false

[handlers]
# Handlers are shell scripts RAUC calls at specific points in the update flow.
# They run as root. RAUC passes context via environment variables:
#   RAUC_SYSTEM_COMPATIBLE, RAUC_BUNDLE_COMPATIBLE, RAUC_BUNDLE_VERSION,
#   RAUC_SLOT_NAME, RAUC_SLOT_DEVICE, RAUC_SLOT_BOOTNAME, RAUC_SLOT_STATE,
#   RAUC_SLOT_VERSION (version currently installed in the target slot)
#
# pre-install= runs after signature verification but before any image is
# written. Exit non-zero to abort the update cleanly (no data has been written).
pre-install=/usr/lib/rauc/pre-install

# post-install= runs after all images have been written and checksums verified,
# but before RAUC sets the bootloader boot order. Exit non-zero to abort — RAUC
# will NOT update the bootloader flags, so the old slot remains active.
post-install=/usr/lib/rauc/post-install

# System handler (optional): a single script invoked for all slot operations.
# Left blank here because we use per-phase scripts above.
# system-info=/usr/lib/rauc/system-info

[slot.boot.0]
# The boot partition holds U-Boot, the kernel image (Image), and the device
# tree blob (.dtb). On this board it is shared between both rootfs slots — a
# single /boot partition updated atomically as part of the bundle.
#
# type=vfat: RAUC will dd the image directly to the block device (raw write).
# For vfat, RAUC mounts the partition and copies files instead of dd.
type=vfat

# device= is the block device that represents this slot. RAUC writes to it
# directly. Verify the partition number with `lsblk` on your target board.
device=/dev/mmcblk0p1

# bootname= is the label U-Boot uses to refer to this slot in BOOT_ORDER.
# It must match what your U-Boot script uses in the boot sequence logic.
bootname=boot

# parent= groups child slots under a parent slot. Child slots are updated
# together as part of one atomic operation. Boot is a child of rootfs.0
# here only if you want to update boot+rootfs atomically; if boot is shared
# between both rootfs slots, omit parent= and list boot as standalone.
# Uncomment the line below if boot is tied to rootfs.0:
# parent=rootfs.0

[slot.rootfs.0]
# Slot A — the primary rootfs partition.
# On a fresh board, slot A is the factory-installed firmware.
# Updates alternate between slot A and slot B.
type=ext4

device=/dev/mmcblk0p2

# bootname= must match the value U-Boot uses in the BOOT_ORDER variable.
# U-Boot script example:
#   if test "${BOOT_ORDER}" = "A B"; then setenv bootpart mmcblk0p2; fi
bootname=A

# readonly=false (default): RAUC can write to this slot when it is inactive.
# RAUC checks at runtime that the slot is not currently mounted read-write
# before writing to it.

[slot.rootfs.1]
# Slot B — the secondary rootfs partition, receives updates when A is active.
type=ext4

device=/dev/mmcblk0p3

bootname=B

# force-install-same=false (default): RAUC skips install if the bundle version
# matches the already-installed version in this slot. Set to true to force
# re-install for testing or recovery.
# force-install-same=false

[slot.data.0]
# The persistent data partition is NOT updated by RAUC. It holds:
#   - /data/rauc-status (RAUC slot state database)
#   - Application configuration and logs
#   - Mutable state that must survive rootfs updates
#
# Defining it here as readonly=true makes RAUC aware of the partition
# (visible in `rauc status`) but prevents accidental writes.
type=ext4
device=/dev/mmcblk0p4
readonly=true
