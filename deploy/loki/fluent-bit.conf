[SERVICE]
    Flush        5
    Log_Level    info

[INPUT]
    Name         tail
    Tag          kern.*
    Path         /var/log/kern.log
    Parser       syslog-rfc3164

[INPUT]
    Name         systemd
    Tag          journal.*
    Systemd_Filter  _TRANSPORT=kernel

[FILTER]
    Name         grep
    Match        *
    Regex        log (EDAC|AER|MCE|RAS|mce|edac|aer|ras)

[FILTER]
    Name         lua
    Match        *
    script       /fluent-bit/scripts/label.lua
    call         add_subsystem

[OUTPUT]
    Name         loki
    Match        *
    Host         loki
    Port         3100
    Labels       job=kernel-faults, node=${HOSTNAME}
    Label_Keys   subsystem, severity
    Auto_Kubernetes_Labels off
