# SPDX-License-Identifier: Apache-2.0
# RBAC for fault-resilience remediation controller.
# ClusterRole is required because the controller patches Node objects
# (cluster-scoped) and creates Events in the default namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fault-resilience-remediation
  namespace: fault-resilience
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fault-resilience-remediation
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fault-resilience-remediation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fault-resilience-remediation
subjects:
  - kind: ServiceAccount
    name: fault-resilience-remediation
    namespace: fault-resilience
