# SPDX-License-Identifier: Apache-2.0
# Fluentbit DaemonSet — ships hw-fault-exporter JSON logs to Loki.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: monitoring
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Grace         5
        Log_Level     warn
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/hw-fault-exporter-*.log
        Parser            cri
        Tag               hw_fault.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name         parser
        Match        hw_fault.*
        Key_Name     log
        Parser       hw_fault_json
        Reserve_Data On

    [FILTER]
        Name         record_modifier
        Match        hw_fault.*
        Record       node_name ${NODE_NAME}
        Record       namespace monitoring

    [OUTPUT]
        Name          loki
        Match         hw_fault.*
        Host          loki.monitoring.svc.cluster.local
        Port          3100
        Labels        job=hw-fault-exporter, node=${NODE_NAME}
        Label_Keys    $level,$collector,$ts
        Line_Format   json
        Auto_Kubernetes_Labels On

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        hw_fault_json
        Format      json
        Time_Key    ts
        Time_Format %Y-%m-%dT%H:%M:%S.%3NZ
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentbit
  namespace: monitoring
  labels:
    app: fluentbit
spec:
  selector:
    matchLabels:
      app: fluentbit
  template:
    metadata:
      labels:
        app: fluentbit
    spec:
      serviceAccountName: fluentbit
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: fluentbit
          image: fluent/fluent-bit:3.1
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests: {cpu: "20m", memory: "32Mi"}
            limits:   {cpu: "100m", memory: "128Mi"}
      volumes:
        - name: config
          configMap:
            name: fluentbit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentbit
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentbit
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentbit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentbit
subjects:
  - kind: ServiceAccount
    name: fluentbit
    namespace: monitoring
