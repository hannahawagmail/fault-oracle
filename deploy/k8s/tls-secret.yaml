# deploy/k8s/tls-secret.yaml — Kubernetes Secret holding the mTLS certificate bundle
# for hw-fault-exporter.
#
# Populate with:
#   kubectl create secret generic hw-fault-exporter-tls \
#     --from-file=ca.crt=security/certs/ca.crt \
#     --from-file=server.crt=security/certs/server.crt \
#     --from-file=server.key=security/certs/server.key \
#     --from-file=client.crt=security/certs/client.crt \
#     -n monitoring
#
# The YAML below is a template — base64 values are placeholders.
# Use `kubectl create secret` (above) or seal with kubeseal for GitOps.
apiVersion: v1
kind: Secret
metadata:
  name: hw-fault-exporter-tls
  namespace: monitoring
  labels:
    app.kubernetes.io/name: hw-fault-exporter
    app.kubernetes.io/component: tls
type: Opaque
data:
  # base64-encoded PEM files — replace with actual values or use kubectl create
  ca.crt:     <base64-encoded-ca-cert>
  server.crt: <base64-encoded-server-cert>
  server.key: <base64-encoded-server-key>
  client.crt: <base64-encoded-client-cert>
