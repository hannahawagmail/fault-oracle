# Create actual secret with:
#   kubectl create secret generic redfish-credentials \
#     --from-literal=password=<YOUR_BMC_PASSWORD> \
#     -n fault-resilience --dry-run=client -o yaml | kubectl apply -f -
# NEVER commit a real password here.
apiVersion: v1
kind: Secret
metadata:
  name: redfish-credentials
  namespace: fault-resilience
type: Opaque
stringData:
  password: "REPLACE_ME"  # Replace before deploying — see instructions above
