global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml
  - /etc/prometheus/recording-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'hw-fault-exporter'
    static_configs:
      - targets: ['hw-fault-exporter:9100']
    labels:
      role: host

  - job_name: 'dpu-fault-exporter'
    static_configs:
      - targets: []  # Add DPU management IPs here: ['<dpu-mgmt-ip>:9200']
    labels:
      role: dpu
