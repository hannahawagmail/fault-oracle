# alertmanager.yml — Basic Alertmanager config
# Configure receivers for your environment (PagerDuty, Slack, email, etc.)
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h

receivers:
  - name: 'default'
    # Add your notification channel here
    # Example Slack:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/...'
    #     channel: '#hw-alerts'

  - name: 'critical'
    # Critical alerts: PagerDuty or dedicated on-call channel

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']
