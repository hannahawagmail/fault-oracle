apiVersion: v1
kind: Service
metadata:
  name: {{ include "hw-fault-exporter.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hw-fault-exporter.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hw-fault-exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
  clusterIP: None
