# SPDX-License-Identifier: Apache-2.0
# sysctl-hardening.conf — Production sysctl settings for ARM fault resilience
#
# Deploy: cp sysctl-hardening.conf /etc/sysctl.d/99-fault-resilience.conf
#         sysctl --system
#
# All values are tuned for embedded/server ARM systems running production workloads.
# Review each section before deploying; some values are workload-dependent.

# ===========================================================================
# KERNEL PANIC POLICY
# ===========================================================================

# Reboot automatically 10 seconds after a kernel panic.
# 0 = halt forever (Linux default, wrong for production).
# Negative = reboot immediately. 10s gives kdump time to save a crash dump.
kernel.panic = 10

# Promote oopses to panics. An oops means the kernel detected an internal
# inconsistency. Continuing after an oops risks further memory corruption.
kernel.panic_on_oops = 1

# Do NOT panic on WARN_ON(). Too many mainline drivers emit warnings on
# normal workloads. Enable on staging only to catch regressions.
kernel.panic_on_warn = 0

# Soft lockup watchdog: a CPU task has not slept for > watchdog_thresh seconds.
# 1 = panic (and reboot) instead of logging the stall and continuing.
kernel.softlockup_panic = 1

# Hard lockup watchdog: a CPU received no interrupt for several seconds.
# Requires hardware NMI watchdog support (standard on ARM Cortex-A with PMU).
kernel.hardlockup_panic = 1

# Panic if an unexpected Non-Maskable Interrupt arrives.
# Protects against hardware signal noise triggering unhandled paths.
kernel.unknown_nmi_panic = 1

# After this many oopses, force a panic. Set to 1 so that the first oops
# triggers a panic (redundant with panic_on_oops=1, but belt-and-suspenders).
kernel.oops_limit = 1

# ===========================================================================
# MEMORY MANAGEMENT
# ===========================================================================

# overcommit_memory=1: always allow memory allocation regardless of actual
# availability. Required for container runtimes (Docker, containerd) that
# fork+exec with copy-on-write and never actually use all allocated virt pages.
# 0 = heuristic (default), 2 = strict (breaks most container workloads).
vm.overcommit_memory = 1

# Aggressively avoid swapping to flash (eMMC/NAND) — repeated writes cause
# flash wear. 10 = only swap when memory pressure is severe.
# Set to 1 if using zram instead of a physical swap partition.
vm.swappiness = 10

# dirty_ratio: % of total memory that can be dirty before a process writing
# data is itself forced to flush. Lower = smaller write spikes on panic.
# This reduces data loss on unexpected power loss.
vm.dirty_ratio = 10

# dirty_background_ratio: % at which background writeback starts.
# 3% triggers background flush early, keeping the dirty pool small.
vm.dirty_background_ratio = 3

# vfs_cache_pressure: rate at which the kernel reclaims dentry/inode cache.
# 50 = more conservative than default (100), keeps more cache on memory pressure.
# Good for workloads with many file lookups (container overlay filesystems).
vm.vfs_cache_pressure = 50

# ===========================================================================
# NETWORK RESILIENCE
# ===========================================================================

# TCP keepalive: send keepalive probes after 600 seconds of idle connection.
# Default is 7200 s (2 hours) — too long for detecting dead peers on embedded.
net.ipv4.tcp_keepalive_time = 600

# Interval between keepalive probes after the first one fails.
net.ipv4.tcp_keepalive_intvl = 60

# Number of keepalive probes to send before declaring the connection dead.
# 3 probes × 60 s interval = dead peer detected within ~180 s of the keepalive.
net.ipv4.tcp_keepalive_probes = 3

# Receive socket buffer maximum. 16 MB allows high-throughput SmartNIC and
# RDMA scenarios without application-level tuning. Kernel auto-tunes within this.
net.core.rmem_max = 16777216

# Send socket buffer maximum. Match rmem_max for symmetric tuning.
net.core.wmem_max = 16777216

# TCP receive buffer: min / default / max in bytes.
# max matches rmem_max so the kernel can grow the buffer for fast peers.
net.ipv4.tcp_rmem = 4096 87380 16777216

# TCP send buffer: min / default / max.
net.ipv4.tcp_wmem = 4096 65536 16777216

# ===========================================================================
# SECURITY HARDENING
# ===========================================================================

# Restrict dmesg access to root. Prevents unprivileged users from reading
# kernel pointers, stack addresses, and driver internals via dmesg.
kernel.dmesg_restrict = 1

# Hide kernel symbol addresses from non-root users.
# 2 = hide from root as well (requires CAP_SYSLOG to read).
# This prevents KASLR bypass via /proc/kallsyms.
kernel.kptr_restrict = 2

# Enable strict reverse path filtering on all interfaces.
# 1 = drop packets whose source address has no route back through the
# interface it arrived on. Prevents IP spoofing attacks.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Restrict ptrace to parent processes only.
# 1 = a process can only be ptraced by its direct parent (or root).
# Prevents lateral debugging attacks between unrelated processes.
kernel.yama.ptrace_scope = 1
